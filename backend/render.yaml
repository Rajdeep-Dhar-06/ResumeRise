services:
  # Express Web API + BullMQ Worker
  - type: web
    name: resumerise-api
    env: node
    buildCommand: npm install
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: JINA_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: resumerise-redis
          property: connectionString

  # Managed Redis Instance
  - type: redis
    name: resumerise-redis
    plan: free
    ipAllowList: []
